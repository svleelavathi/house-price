<!DOCTYPE html>
<html>
<head>
    <title>House Price Prediction</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🏠 House Price Prediction</h1>

        <!-- HOUSE IMAGES -->
        <div class="images">
            <img src="https://images.unsplash.com/photo-1564013799919-ab600027ffc6" />
            <img src="https://images.unsplash.com/photo-1570129477492-45c003edd2be" />
            <img src="https://images.unsplash.com/photo-1507089947368-19c1da9775ae" />
        </div>

        <input type="number" id="size" placeholder="Size (sq ft)">
        <input type="number" id="bedrooms" placeholder="Bedrooms">
        <input type="number" id="age" placeholder="Age of House">

        <button onclick="predictPrice()">Predict Price</button>

        <h2 id="result"></h2>

    </div>

    <script src="script.js"></script>

</body>
</html>
