<!DOCTYPE html>
<html>
<head>
    <title>House Price Prediction</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🏠 House Price Prediction</h1>

        <!-- BIG HOUSE IMAGES -->
        <div class="image-box">

            <img src="https://images.unsplash.com/photo-1505691938895-1758d7feb511" />

            <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c" />

            <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9" />

        </div>

        <input type="number" id="size" placeholder="Size (sq ft)">
        <input type="number" id="bedrooms" placeholder="Bedrooms">
        <input type="number" id="age" placeholder="Age of House">

        <button onclick="predictPrice()">Predict Price</button>

        <h2 id="result"></h2>

    </div>

    <script src="script.js"></script>

</body>
</html>
